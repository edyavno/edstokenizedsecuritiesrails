<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 2475" width="640" height="2475" font-family="'Source Sans Pro','Source Sans 3','Noto Sans','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">How tokenized securities fit together</title><desc id="d">An issuer and transfer agent mint a security token on a shared 24/7 ledger; only allowlisted, KYC'd wallets can hold it. Trade and settle: 3a orders are matched on a venue (order book or RFQ on an exchange, ATS or broker, or an AMM pool; matching off- or on-chain); 3b pre-trade checks confirm eligibility and that both legs are pre-funded; 3c a smart contract swaps the security token for a cash token in one transaction (atomic DvP), final on-chain instead of T+1 via CCP and CSD; 3d balances update and the register is updated or reconciled. Dividends, votes and redemptions flow back through the token. Inset: native tokens are the register; wrapped tokens are claims on shares held by a custodian.</desc><defs><marker id="ar-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#3b6e9c"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#3f9a7c"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d08a2e"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8d9aa6"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8a73c9"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1f2a33" flood-opacity="0.10"/></filter></defs><rect x="1" y="1" width="638" height="2473" rx="22" fill="#fbfbfd" stroke="#e2dfdc"/><text x="30" y="52" font-size="32" fill="#1f2a33" font-weight="800" text-anchor="start">How tokenized securities</text><text x="30" y="90" font-size="32" fill="#1f2a33" font-weight="800" text-anchor="start">fit together</text><text x="30" y="124" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">What's new vs traditional rails</text><rect x="30" y="150" width="580" height="120" rx="18" fill="#e4f5ee" stroke="#e3e7ee" stroke-width="1.6" filter="url(#sh)"/><rect x="30" y="164" width="5" height="92" rx="2.5" fill="#3f9a7c"/><text x="52" y="190" font-size="24" fill="#1f2a33" font-weight="700" text-anchor="start">Identity + allowlist</text><text x="52" y="222" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">Only KYC'd wallets can hold</text><text x="52" y="252" font-size="16" fill="#6b7a86" font-weight="400" text-anchor="start" font-style="italic">TradFi: account onboarding / KYC</text><circle cx="576" cy="183" r="19" fill="#e4f5ee"/><g transform="translate(564,171)" fill="none" stroke="#3f9a7c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.5 7.5-8 9-4.5-1.5-8-4.5-8-9V6z M8.5 12l2.5 2.5 4.5-5"/></g><rect x="30" y="310" width="580" height="120" rx="18" fill="#e7f0fa" stroke="#e3e7ee" stroke-width="1.6" filter="url(#sh)"/><rect x="30" y="324" width="5" height="92" rx="2.5" fill="#3b6e9c"/><text x="52" y="350" font-size="24" fill="#1f2a33" font-weight="700" text-anchor="start">Issuer + transfer agent</text><text x="52" y="382" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">Keeps the official register</text><text x="52" y="412" font-size="16" fill="#6b7a86" font-weight="400" text-anchor="start" font-style="italic">TradFi: issuer, registrar / CSD</text><circle cx="576" cy="343" r="19" fill="#e7f0fa"/><g transform="translate(564,331)" fill="none" stroke="#3b6e9c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></g><rect x="30" y="470" width="580" height="520" rx="18" fill="#f2eefc" stroke="#8a73c9" stroke-width="1.6" stroke-dasharray="9 7"/><text x="50" y="502" font-size="18" fill="#8a73c9" font-weight="700" text-anchor="start">SHARED LEDGER · 24/7 · composable</text><rect x="50" y="520" width="540" height="120" rx="18" fill="#fff" stroke="#e3e7ee" stroke-width="1.6" filter="url(#sh)"/><rect x="50" y="534" width="5" height="92" rx="2.5" fill="#3b6e9c"/><text x="72" y="560" font-size="24" fill="#1f2a33" font-weight="700" text-anchor="start">Security token</text><text x="72" y="592" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">Is the register (native) or mirrors it</text><text x="72" y="622" font-size="16" fill="#6b7a86" font-weight="400" text-anchor="start" font-style="italic">Rules in code: transfer checks</text><circle cx="556" cy="553" r="19" fill="#e7f0fa"/><g transform="translate(544,541)" fill="none" stroke="#3b6e9c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.8v9.4L12 21.5l-8.5-4.8V7.3z M12 7v10 M8 9.5l8 5 M16 9.5l-8 5"/></g><circle cx="320" cy="725" r="62" fill="#3b6e9c"/><text x="320" y="719" font-size="24" fill="#fff" font-weight="800" text-anchor="middle">Atomic</text><text x="320" y="747" font-size="24" fill="#fff" font-weight="800" text-anchor="middle">DvP</text><text x="400" y="712" font-size="17" fill="#1f2a33" font-weight="600" text-anchor="start">One transaction:</text><text x="400" y="734" font-size="17" fill="#1f2a33" font-weight="600" text-anchor="start">both legs settle,</text><text x="400" y="756" font-size="17" fill="#1f2a33" font-weight="600" text-anchor="start">or neither</text><rect x="50" y="810" width="540" height="120" rx="18" fill="#fff" stroke="#e3e7ee" stroke-width="1.6" filter="url(#sh)"/><rect x="50" y="824" width="5" height="92" rx="2.5" fill="#d08a2e"/><text x="72" y="850" font-size="24" fill="#1f2a33" font-weight="700" text-anchor="start">Cash token</text><text x="72" y="882" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">Stablecoin, tokenized deposit, wCBDC</text><text x="72" y="912" font-size="16" fill="#6b7a86" font-weight="400" text-anchor="start" font-style="italic">TradFi: the cash leg</text><circle cx="556" cy="843" r="19" fill="#fcf0dd"/><g transform="translate(544,831)" fill="none" stroke="#d08a2e" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0.01 0z M12 7v10 M15 9.2c-.6-.9-1.7-1.4-3-1.4-1.8 0-3 .9-3 2.1 0 2.9 6 1.5 6 4.3 0 1.3-1.3 2.2-3 2.2-1.4 0-2.6-.6-3.1-1.6"/></g><path d="M320,640 L320,655" fill="none" stroke="#3b6e9c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-blue)"/><path d="M320,810 L320,795" fill="none" stroke="#3b6e9c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-blue)"/><text x="50" y="968" font-size="17" fill="#8a73c9" font-weight="600" text-anchor="start">Gross settlement: both legs pre-funded</text><rect x="30" y="1040" width="580" height="150" rx="18" fill="#fff" stroke="#e3e7ee" stroke-width="1.6" filter="url(#sh)"/><rect x="30" y="1054" width="5" height="122" rx="2.5" fill="#8d9aa6"/><text x="52" y="1080" font-size="24" fill="#1f2a33" font-weight="700" text-anchor="start">Trading venue</text><text x="52" y="1112" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">Order book or RFQ: exchange, ATS, broker</text><text x="52" y="1138" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">or AMM / onchain pool</text><text x="52" y="1164" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">Matching off-chain or on-chain</text><circle cx="576" cy="1073" r="19" fill="#eef1f4"/><g transform="translate(564,1061)" fill="none" stroke="#8d9aa6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4 M4 20h16 M7 15l4-4 3 3 5-6"/></g><rect x="30" y="1230" width="580" height="110" rx="18" fill="#fff" stroke="#e3e7ee" stroke-width="1.6" filter="url(#sh)"/><rect x="30" y="1244" width="5" height="82" rx="2.5" fill="#8d9aa6"/><text x="52" y="1270" font-size="24" fill="#1f2a33" font-weight="700" text-anchor="start">Investor wallets</text><text x="52" y="1302" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">Custodial or self-held</text><text x="52" y="1322" font-size="16" fill="#6b7a86" font-weight="400" text-anchor="start" font-style="italic">TradFi: brokerage account</text><circle cx="576" cy="1263" r="19" fill="#eef1f4"/><g transform="translate(564,1251)" fill="none" stroke="#8d9aa6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4z M4 7l11-3v3 M15 13.5h2"/></g><path d="M320,1230 L320,1198" fill="none" stroke="#3b6e9c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-blue)"/><path d="M320,1040 L320,998" fill="none" stroke="#3b6e9c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-blue)"/><circle cx="180" cy="1015" r="21" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="180" y="1021.84" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">3a</text><circle cx="240" cy="1015" r="21" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="240" y="1021.84" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">3b</text><circle cx="560" cy="725" r="21" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="560" y="731.84" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">3c</text><circle cx="470" cy="1215" r="21" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="470" y="1221.84" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">3d</text><path d="M150,430 L150,512" fill="none" stroke="#3b6e9c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-blue)"/><circle cx="150" cy="462" r="16" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="150" y="468.84" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">1</text><path d="M610,210 L627,210 L627,580 L598,580" fill="none" stroke="#3f9a7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#ar-green)"/><circle cx="627" cy="300" r="14" fill="#3f9a7c" stroke="#fff" stroke-width="3"/><text x="627" y="305.76" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><path d="M50,620 L15,620 L15,1285 L22,1285" fill="none" stroke="#d08a2e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-amber)"/><circle cx="15" cy="1100" r="13" fill="#d08a2e" stroke="#fff" stroke-width="3"/><text x="15" y="1105.4" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">4</text><circle cx="46" cy="1389" r="14" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="46" y="1394.76" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="74" y="1395" font-size="19" fill="#1f2a33"><tspan font-weight="700">Issue:</tspan> mint; keep in sync with the register</text><circle cx="46" cy="1427" r="14" fill="#3f9a7c" stroke="#fff" stroke-width="3"/><text x="46" y="1432.76" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="74" y="1433" font-size="19" fill="#1f2a33"><tspan font-weight="700">Permission:</tspan> transfers check the allowlist</text><circle cx="46" cy="1465" r="14" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="46" y="1470.76" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="74" y="1471" font-size="19" fill="#1f2a33"><tspan font-weight="700">Trade + settle</tspan> </text><circle cx="70" cy="1503" r="19" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="70" y="1508.76" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3a</text><text x="104" y="1509" font-size="19" fill="#1f2a33"><tspan font-weight="700">Match:</tspan> order book, RFQ or AMM pool</text><circle cx="70" cy="1541" r="19" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="70" y="1546.76" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3b</text><text x="104" y="1547" font-size="19" fill="#1f2a33"><tspan font-weight="700">Checks:</tspan> allowlist; both legs pre-funded</text><circle cx="70" cy="1579" r="19" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="70" y="1584.76" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3c</text><text x="104" y="1585" font-size="19" fill="#1f2a33"><tspan font-weight="700">Settle:</tspan> atomic DvP, final on-chain (vs T+1)</text><circle cx="70" cy="1617" r="19" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="70" y="1622.76" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3d</text><text x="104" y="1623" font-size="19" fill="#1f2a33"><tspan font-weight="700">Post-trade:</tspan> balances, register, reporting</text><circle cx="46" cy="1655" r="14" fill="#d08a2e" stroke="#fff" stroke-width="3"/><text x="46" y="1660.76" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="74" y="1661" font-size="19" fill="#1f2a33"><tspan font-weight="700">Service:</tspan> dividends, votes, redemption</text><text x="30" y="1715" font-size="18" fill="#4a5560" font-weight="400" text-anchor="start" font-style="italic">Trade-off: pre-funding replaces netting;</text><text x="30" y="1741" font-size="18" fill="#4a5560" font-weight="400" text-anchor="start" font-style="italic">24/7 vs market hours is a design choice.</text><rect x="30" y="1775" width="580" height="670" rx="18" fill="#fff" stroke="#e3e7ee" stroke-width="1.6" filter="url(#sh)"/><text x="52" y="1815" font-size="23" fill="#1f2a33" font-weight="800" text-anchor="start">Native vs wrapped</text><text x="52" y="1861" font-size="24" fill="#3b6e9c" font-weight="700" text-anchor="start">Native</text><text x="52" y="1889" font-size="20" fill="#4a5560" font-weight="400" text-anchor="start">Issued on the ledger; the</text><text x="52" y="1913" font-size="20" fill="#4a5560" font-weight="400" text-anchor="start">token is the register entry</text><rect x="60" y="1933" width="520" height="64" rx="12" fill="#e7f0fa" stroke="#3b6e9c" stroke-width="1.6"/><text x="320.0" y="1973" font-size="21" fill="#1f2a33" font-weight="700" text-anchor="middle">Register = token</text><text x="52" y="2027" font-size="16" fill="#6b7a86" font-weight="400" text-anchor="start" font-style="italic">e.g. issuer-sponsored shares</text><line x1="52" y1="2057" x2="588" y2="2057" stroke="#e3e7ee" stroke-width="2"/><text x="52" y="2097" font-size="24" fill="#d08a2e" font-weight="700" text-anchor="start">Wrapped / backed</text><text x="52" y="2125" font-size="20" fill="#4a5560" font-weight="400" text-anchor="start">Share held by a custodian;</text><text x="52" y="2149" font-size="20" fill="#4a5560" font-weight="400" text-anchor="start">token is a claim on it</text><rect x="60" y="2169" width="520" height="58" rx="12" fill="#fcf0dd" stroke="#d08a2e" stroke-width="1.6"/><text x="320.0" y="2205" font-size="20" fill="#1f2a33" font-weight="700" text-anchor="middle">Share at custodian</text><path d="M320.0,2229 L320.0,2267" fill="none" stroke="#3b6e9c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-blue)"/><text x="334.0" y="2255" font-size="17" fill="#4a5560" font-weight="400" text-anchor="start">1:1</text><rect x="60" y="2273" width="520" height="58" rx="12" fill="#fff" stroke="#d08a2e" stroke-width="1.6"/><text x="320.0" y="2309" font-size="20" fill="#1f2a33" font-weight="700" text-anchor="middle">Token (redeemable)</text><text x="52" y="2363" font-size="16" fill="#6b7a86" font-weight="400" text-anchor="start" font-style="italic">e.g. entitlements, backed notes</text><text x="52" y="2395" font-size="20" fill="#4a5560" font-weight="400" text-anchor="start">Token supply must reconcile</text><text x="52" y="2419" font-size="20" fill="#4a5560" font-weight="400" text-anchor="start">with shares held</text></svg>