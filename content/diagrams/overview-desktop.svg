<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1130" width="1400" height="1130" font-family="'Source Sans Pro','Source Sans 3','Noto Sans','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">How tokenized securities fit together</title><desc id="d">An issuer and transfer agent mint a security token on a shared 24/7 ledger; only allowlisted, KYC'd wallets can hold it. Trade and settle: 3a orders are matched on a venue (order book or RFQ on an exchange, ATS or broker, or an AMM pool; matching off- or on-chain); 3b pre-trade checks confirm eligibility and that both legs are pre-funded; 3c a smart contract swaps the security token for a cash token in one transaction (atomic DvP), final on-chain instead of T+1 via CCP and CSD; 3d balances update and the register is updated or reconciled. Dividends, votes and redemptions flow back through the token. Inset: native tokens are the register; wrapped tokens are claims on shares held by a custodian.</desc><defs><marker id="ar-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#3b6e9c"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#3f9a7c"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d08a2e"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8d9aa6"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8a73c9"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1f2a33" flood-opacity="0.10"/></filter></defs><rect x="1" y="1" width="1398" height="1128" rx="22" fill="#fbfbfd" stroke="#e2dfdc"/><text x="40" y="58" font-size="34" fill="#1f2a33" font-weight="800" text-anchor="start">How tokenized securities fit together</text><text x="40" y="90" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">What's new vs traditional rails, mapped to familiar roles</text><rect x="40" y="300" width="930" height="360" rx="18" fill="#f2eefc" stroke="#8a73c9" stroke-width="1.6" stroke-dasharray="9 7"/><text x="340" y="334" font-size="18" fill="#8a73c9" font-weight="700" text-anchor="start">SHARED LEDGER · public or permissioned · 24/7 · composable</text><rect x="40" y="120" width="330" height="130" rx="18" fill="#e7f0fa" stroke="#e3e7ee" stroke-width="1.6" filter="url(#sh)"/><rect x="40" y="134" width="5" height="102" rx="2.5" fill="#3b6e9c"/><text x="62" y="160" font-size="24" fill="#1f2a33" font-weight="700" text-anchor="start">Issuer + transfer agent</text><text x="62" y="192" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">Keeps the official register</text><text x="62" y="232" font-size="16" fill="#6b7a86" font-weight="400" text-anchor="start" font-style="italic">TradFi: issuer, registrar / CSD</text><circle cx="336" cy="153" r="19" fill="#e7f0fa"/><g transform="translate(324,141)" fill="none" stroke="#3b6e9c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></g><rect x="630" y="120" width="340" height="130" rx="18" fill="#e4f5ee" stroke="#e3e7ee" stroke-width="1.6" filter="url(#sh)"/><rect x="630" y="134" width="5" height="102" rx="2.5" fill="#3f9a7c"/><text x="652" y="160" font-size="24" fill="#1f2a33" font-weight="700" text-anchor="start">Identity + allowlist</text><text x="652" y="192" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">Only KYC'd wallets can hold</text><text x="652" y="232" font-size="16" fill="#6b7a86" font-weight="400" text-anchor="start" font-style="italic">TradFi: account onboarding / KYC</text><circle cx="936" cy="153" r="19" fill="#e4f5ee"/><g transform="translate(924,141)" fill="none" stroke="#3f9a7c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.5 7.5-8 9-4.5-1.5-8-4.5-8-9V6z M8.5 12l2.5 2.5 4.5-5"/></g><rect x="70" y="370" width="320" height="160" rx="18" fill="#fff" stroke="#e3e7ee" stroke-width="1.6" filter="url(#sh)"/><rect x="70" y="384" width="5" height="132" rx="2.5" fill="#3b6e9c"/><text x="92" y="410" font-size="24" fill="#1f2a33" font-weight="700" text-anchor="start">Security token</text><text x="92" y="442" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">Is the register (native)</text><text x="92" y="468" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">or mirrors it (wrapped)</text><text x="92" y="512" font-size="16" fill="#6b7a86" font-weight="400" text-anchor="start" font-style="italic">Rules in code: transfer checks</text><circle cx="356" cy="403" r="19" fill="#e7f0fa"/><g transform="translate(344,391)" fill="none" stroke="#3b6e9c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.8v9.4L12 21.5l-8.5-4.8V7.3z M12 7v10 M8 9.5l8 5 M16 9.5l-8 5"/></g><rect x="620" y="370" width="320" height="160" rx="18" fill="#fff" stroke="#e3e7ee" stroke-width="1.6" filter="url(#sh)"/><rect x="620" y="384" width="5" height="132" rx="2.5" fill="#d08a2e"/><text x="642" y="410" font-size="24" fill="#1f2a33" font-weight="700" text-anchor="start">Cash token</text><text x="642" y="442" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">Stablecoin, tokenized</text><text x="642" y="468" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">deposit or wholesale CBDC</text><text x="642" y="512" font-size="16" fill="#6b7a86" font-weight="400" text-anchor="start" font-style="italic">TradFi: the cash leg</text><circle cx="906" cy="403" r="19" fill="#fcf0dd"/><g transform="translate(894,391)" fill="none" stroke="#d08a2e" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0.01 0z M12 7v10 M15 9.2c-.6-.9-1.7-1.4-3-1.4-1.8 0-3 .9-3 2.1 0 2.9 6 1.5 6 4.3 0 1.3-1.3 2.2-3 2.2-1.4 0-2.6-.6-3.1-1.6"/></g><circle cx="505" cy="450" r="78" fill="#3b6e9c"/><text x="505" y="444" font-size="24" fill="#fff" font-weight="800" text-anchor="middle">Atomic</text><text x="505" y="472" font-size="24" fill="#fff" font-weight="800" text-anchor="middle">DvP</text><rect x="395" y="556" width="560" height="82" rx="12" fill="#ffffff" stroke="#cfdcea" stroke-width="1.6"/><text x="415" y="588" font-size="18" fill="#1f2a33" font-weight="600" text-anchor="start">Smart contract swaps token for cash in one</text><text x="415" y="614" font-size="18" fill="#1f2a33" font-weight="600" text-anchor="start">transaction: both legs settle, or neither</text><rect x="40" y="720" width="240" height="130" rx="18" fill="#fff" stroke="#e3e7ee" stroke-width="1.6" filter="url(#sh)"/><rect x="40" y="734" width="5" height="102" rx="2.5" fill="#8d9aa6"/><text x="62" y="760" font-size="24" fill="#1f2a33" font-weight="700" text-anchor="start">Investor wallet</text><text x="62" y="792" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">Custodial or self-held</text><text x="62" y="832" font-size="16" fill="#6b7a86" font-weight="400" text-anchor="start" font-style="italic">TradFi: brokerage acct</text><circle cx="246" cy="753" r="19" fill="#eef1f4"/><g transform="translate(234,741)" fill="none" stroke="#8d9aa6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4z M4 7l11-3v3 M15 13.5h2"/></g><rect x="320" y="720" width="370" height="150" rx="18" fill="#fff" stroke="#e3e7ee" stroke-width="1.6" filter="url(#sh)"/><rect x="320" y="734" width="5" height="122" rx="2.5" fill="#8d9aa6"/><text x="342" y="760" font-size="24" fill="#1f2a33" font-weight="700" text-anchor="start">Trading venue</text><text x="342" y="792" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">Order book or RFQ: exchange,</text><text x="342" y="818" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">ATS, broker · or AMM pool</text><text x="342" y="844" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">Matching off- or on-chain</text><circle cx="656" cy="753" r="19" fill="#eef1f4"/><g transform="translate(644,741)" fill="none" stroke="#8d9aa6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4 M4 20h16 M7 15l4-4 3 3 5-6"/></g><rect x="730" y="720" width="240" height="130" rx="18" fill="#fff" stroke="#e3e7ee" stroke-width="1.6" filter="url(#sh)"/><rect x="730" y="734" width="5" height="102" rx="2.5" fill="#8d9aa6"/><text x="752" y="760" font-size="24" fill="#1f2a33" font-weight="700" text-anchor="start">Investor wallet</text><text x="752" y="792" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">The counterparty</text><text x="752" y="832" font-size="16" fill="#6b7a86" font-weight="400" text-anchor="start" font-style="italic">TradFi: brokerage acct</text><circle cx="936" cy="753" r="19" fill="#eef1f4"/><g transform="translate(924,741)" fill="none" stroke="#8d9aa6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4z M4 7l11-3v3 M15 13.5h2"/></g><path d="M390,450 L423,450" fill="none" stroke="#3b6e9c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-blue)"/><path d="M620,450 L587,450" fill="none" stroke="#3b6e9c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-blue)"/><path d="M280,785 L312,785" fill="none" stroke="#3b6e9c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-blue)"/><path d="M730,785 L698,785" fill="none" stroke="#3b6e9c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-blue)"/><path d="M205,250 L205,362" fill="none" stroke="#3b6e9c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-blue)"/><circle cx="205" cy="290" r="16" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="205" y="296.84" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">1</text><path d="M800,250 L800,275 L300,275 L300,362" fill="none" stroke="#3f9a7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#ar-green)"/><circle cx="560" cy="275" r="16" fill="#3f9a7c" stroke="#fff" stroke-width="3"/><text x="560" y="281.84" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">2</text><path d="M505,720 L505,646" fill="none" stroke="#3b6e9c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-blue)"/><path d="M505,556 L505,536" fill="none" stroke="#3b6e9c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-blue)"/><circle cx="470" cy="690" r="21" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="470" y="696.84" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">3a</text><circle cx="540" cy="690" r="21" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="540" y="696.84" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">3b</text><circle cx="590" cy="395" r="21" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="590" y="401.84" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">3c</text><path d="M120,530 L120,712" fill="none" stroke="#d08a2e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-amber)"/><circle cx="120" cy="612" r="16" fill="#d08a2e" stroke="#fff" stroke-width="3"/><text x="120" y="618.84" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">4</text><rect x="1010" y="120" width="350" height="670" rx="18" fill="#fff" stroke="#e3e7ee" stroke-width="1.6" filter="url(#sh)"/><text x="1032" y="160" font-size="23" fill="#1f2a33" font-weight="800" text-anchor="start">Native vs wrapped</text><text x="1032" y="206" font-size="24" fill="#3b6e9c" font-weight="700" text-anchor="start">Native</text><text x="1032" y="234" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">Issued on the ledger; the</text><text x="1032" y="258" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">token is the register entry</text><rect x="1040" y="278" width="290" height="64" rx="12" fill="#e7f0fa" stroke="#3b6e9c" stroke-width="1.6"/><text x="1185.0" y="318" font-size="21" fill="#1f2a33" font-weight="700" text-anchor="middle">Register = token</text><text x="1032" y="372" font-size="16" fill="#6b7a86" font-weight="400" text-anchor="start" font-style="italic">e.g. issuer-sponsored shares</text><line x1="1032" y1="402" x2="1338" y2="402" stroke="#e3e7ee" stroke-width="2"/><text x="1032" y="442" font-size="24" fill="#d08a2e" font-weight="700" text-anchor="start">Wrapped / backed</text><text x="1032" y="470" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">Share held by a custodian;</text><text x="1032" y="494" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">token is a claim on it</text><rect x="1040" y="514" width="290" height="58" rx="12" fill="#fcf0dd" stroke="#d08a2e" stroke-width="1.6"/><text x="1185.0" y="550" font-size="20" fill="#1f2a33" font-weight="700" text-anchor="middle">Share at custodian</text><path d="M1185.0,574 L1185.0,612" fill="none" stroke="#3b6e9c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-blue)"/><text x="1199.0" y="600" font-size="17" fill="#4a5560" font-weight="400" text-anchor="start">1:1</text><rect x="1040" y="618" width="290" height="58" rx="12" fill="#fff" stroke="#d08a2e" stroke-width="1.6"/><text x="1185.0" y="654" font-size="20" fill="#1f2a33" font-weight="700" text-anchor="middle">Token (redeemable)</text><text x="1032" y="708" font-size="16" fill="#6b7a86" font-weight="400" text-anchor="start" font-style="italic">e.g. entitlements, backed notes</text><text x="1032" y="740" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">Token supply must reconcile</text><text x="1032" y="764" font-size="19" fill="#4a5560" font-weight="400" text-anchor="start">with shares held</text><circle cx="56" cy="924" r="14" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="56" y="929.76" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="84" y="930" font-size="19" fill="#1f2a33"><tspan font-weight="700">Issue:</tspan> mint tokens; keep them in sync with the register</text><circle cx="56" cy="960" r="14" fill="#3f9a7c" stroke="#fff" stroke-width="3"/><text x="56" y="965.76" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="84" y="966" font-size="19" fill="#1f2a33"><tspan font-weight="700">Permission:</tspan> every transfer checks the allowlist</text><circle cx="56" cy="996" r="14" fill="#d08a2e" stroke="#fff" stroke-width="3"/><text x="56" y="1001.76" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="84" y="1002" font-size="19" fill="#1f2a33"><tspan font-weight="700">Service:</tspan> dividends, votes, redemption via the token</text><text x="40" y="1050" font-size="18" fill="#4a5560" font-weight="400" text-anchor="start" font-style="italic">Trade-offs: pre-funding replaces netting (a liquidity cost);</text><text x="40" y="1076" font-size="18" fill="#4a5560" font-weight="400" text-anchor="start" font-style="italic">24/7 settlement vs market hours is a design choice.</text><circle cx="676" cy="924" r="14" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="676" y="929.76" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="704" y="930" font-size="19" fill="#1f2a33"><tspan font-weight="700">Trade + settle</tspan> </text><circle cx="676" cy="960" r="19" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="676" y="965.76" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3a</text><text x="710" y="966" font-size="17" fill="#1f2a33"><tspan font-weight="700">Match:</tspan> order book or RFQ on an exchange, ATS or broker, or an AMM pool</text><circle cx="676" cy="996" r="19" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="676" y="1001.76" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3b</text><text x="710" y="1002" font-size="17" fill="#1f2a33"><tspan font-weight="700">Pre-trade checks:</tspan> allowlist, plus both legs pre-funded (no netting or credit)</text><circle cx="676" cy="1032" r="19" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="676" y="1037.76" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3c</text><text x="710" y="1038" font-size="17" fill="#1f2a33"><tspan font-weight="700">Settle:</tspan> atomic DvP in one transaction, final on-chain (vs T+1 via CCP/CSD)</text><circle cx="676" cy="1068" r="19" fill="#3b6e9c" stroke="#fff" stroke-width="3"/><text x="676" y="1073.76" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3d</text><text x="710" y="1074" font-size="17" fill="#1f2a33"><tspan font-weight="700">Post-trade:</tspan> balances update; register updated or reconciled; reporting</text></svg>