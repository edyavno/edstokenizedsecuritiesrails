# Cloudflare Pages config. Shared annotate.js comments are PREVIEW ONLY:
# production has no ANNOTATE_DB binding and ANNOTATE_ENABLED unset, so the Function returns 404.
name = "edstsr"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

# PRODUCTION bindings (top level). Never bind ANNOTATE_DB here: the review tool and the
# preview page-view logger must stay preview-only. Prod DB edstsr-signups holds signups + page_views (IP + geo).
[[d1_databases]]
binding = "SIGNUP_DB"
database_name = "edstsr-signups"
database_id = "3aed0cf8-caa2-47ee-8b3a-2a5c34b9209f"

[[d1_databases]]
binding = "PAGEVIEW_DB"
database_name = "edstsr-signups"
database_id = "3aed0cf8-caa2-47ee-8b3a-2a5c34b9209f"

[env.preview.vars]
ANNOTATE_ENABLED = "1"
ANNOTATE_REVIEW_ID = "edstsr-preview"
# ANNOTATE_AUTHORS is a Pages preview secret (dashboard), kept out of the public repo.

[[env.preview.d1_databases]]
binding = "ANNOTATE_DB"
database_name = "edstsr-annotate-preview"
database_id = "bd141f53-0942-42b3-a94a-8fd6fcb9bfdf"

# Email signups (collect only) share the preview D1; table `signups` (annotate-db/signups.sql).
[[env.preview.d1_databases]]
binding = "SIGNUP_DB"
database_name = "edstsr-annotate-preview"
database_id = "bd141f53-0942-42b3-a94a-8fd6fcb9bfdf"
